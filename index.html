<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal del nadador · Club Náutico</title>
  <meta name="description" content="Portal del nadador del Club Náutico: tus tiempos, tests y progreso en un solo lugar.">
  <meta name="theme-color" content="#060A12">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232F6BFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2.5 20 5.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z'/%3E%3Cpath d='M7.5 12c1.2-1.2 2.3-1.2 3.5 0s2.3 1.2 3.5 0 1.3-1.1 2-.6'/%3E%3C/svg%3E">
  <script>
    // Anti-clickjacking: si la página está dentro de un marco ajeno, no se muestra la app.
    try { if (window.top !== window.self) { document.documentElement.style.display = 'none'; } } catch (e) { document.documentElement.style.display = 'none'; }
    // Tema antes del primer pintado (oscuro por defecto).
    (function () {
      var t = 'dark';
      try { var g = localStorage.getItem('portal.tema'); if (g === 'light' || g === 'dark') t = g; } catch (e) {}
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'light' ? '#F3F6FC' : '#060A12';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/vistas-seguimiento.css">

  <link rel="stylesheet" href="css/clave.css">
</head>

</body>
</html>
